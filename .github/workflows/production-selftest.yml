name: Production Selftest

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_PRODUCTION_SELFTEST only after Human approval'
        required: true
        type: string

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm Human-approved production self-test
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'RUN_PRODUCTION_SELFTEST'

      - name: Hit production selftest
        run: |
          set -e
          URL="https://cute-frangipane-efe657.netlify.app/.netlify/functions/selftest"
          echo "GET $URL"
          RES=$(curl -sS -w "\n%{http_code}" "$URL")
          BODY=$(echo "$RES" | head -n1)
          CODE=$(echo "$RES" | tail -n1)
          echo "HTTP $CODE"
          echo "Body: $BODY"
          echo "$BODY" | jq -e '.ok == true and .sample == "pong"' >/dev/null
